name: Build (Web + Android APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web game
        env:
          VITE_WEB_VERSION: ${{ github.run_number }}
        run: npm run build

      - name: Package over-the-air update
        run: |
          (cd dist && zip -qr ../web.zip .)
          echo "NATIVE_VERSION=$(grep -oP 'NATIVE_VERSION = \K[0-9]+' src/version.js)" >> "$GITHUB_ENV"

      - name: Upload web build for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log || {
            # Surface the Gradle error as annotations so it is readable from the run summary.
            grep -A25 "What went wrong" gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            grep -E "error:|e: |FAILURE" gradle.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KemikVadisi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KemikVadisi-apk
          path: KemikVadisi.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          NOTES="Otomatik derleme · commit ${GITHUB_SHA::7}. APK'yı indirip telefona kur; sonraki oyun güncellemeleri uygulama içinden otomatik gelir.
          <!--kv {\"web\":${{ github.run_number }},\"native\":${NATIVE_VERSION}}-->"
          gh release create latest KemikVadisi.apk web.zip \
            --target "${GITHUB_SHA}" \
            --title "Kemik Vadisi — son sürüm (#${{ github.run_number }})" \
            --notes "$NOTES" \
            --latest

  # Web version on GitHub Pages (repo Settings → Pages → Source: GitHub Actions). Never fails the build.
  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4
